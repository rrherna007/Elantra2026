<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elantra N Garage Pro</title>

<style>
:root{
  --bg:#07090d;
  --panel:#111722;
  --panel2:#151d2b;
  --text:#f4f7fb;
  --muted:#9aa8bd;
  --blue:#35a7ff;
  --red:#ff3b3b;
  --green:#36d399;
  --yellow:#ffd166;
  --line:#263246;
  --shadow:0 12px 35px rgba(0,0,0,.35);
  --radius:18px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

.app{
  max-width:1180px;
  margin:0 auto;
  padding:16px 16px 90px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:linear-gradient(180deg,#07090d 75%,rgba(7,9,13,0));
  padding:12px 0 18px;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:space-between;
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:48px;
  height:48px;
  border-radius:16px;
  background:linear-gradient(135deg,var(--blue),#0b4dff 45%,var(--red));
  display:grid;
  place-items:center;
  font-weight:900;
  box-shadow:var(--shadow);
}

h1{
  font-size:22px;
  margin:0;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.pill{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:999px;
  padding:8px 11px;
  color:var(--muted);
  font-size:12px;
}

nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-top:14px;
}

nav button{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  border-radius:999px;
  padding:10px 14px;
  white-space:nowrap;
}

nav button.active{
  background:var(--blue);
  border-color:var(--blue);
  color:#001321;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px;
}

.card{
  grid-column:span 12;
  background:linear-gradient(180deg,var(--panel),#0e131d);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
}

@media(min-width:760px){
  .half{grid-column:span 6}
  .third{grid-column:span 4}
  .two{grid-column:span 8}
  .four{grid-column:span 4}
}

.hero{
  background:
  radial-gradient(circle at 20% 0%,rgba(53,167,255,.25),transparent 32%),
  radial-gradient(circle at 95% 30%,rgba(255,59,59,.23),transparent 28%),
  linear-gradient(180deg,#101827,#07090d);
  padding:20px;
}

.hero h2{
  font-size:28px;
  margin:0 0 8px;
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
}

.stat{
  flex:1;
  min-width:120px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
}

.stat b{
  font-size:20px;
  display:block;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:0 0 6px;
}

input,select,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#080d15;
  color:var(--text);
  border-radius:13px;
  padding:12px;
  outline:none;
}

textarea{
  min-height:92px;
  resize:vertical;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

@media(min-width:760px){
  .formgrid{
    grid-template-columns:repeat(2,1fr);
  }

  .formgrid .wide{
    grid-column:span 2;
  }
}

.btn{
  border:0;
  background:var(--blue);
  color:#001321;
  border-radius:13px;
  padding:12px 14px;
  font-weight:800;
  cursor:pointer;
}

.btn.secondary{
  background:#202b3d;
  color:var(--text);
  border:1px solid var(--line);
}

.btn.danger{
  background:var(--red);
  color:white;
}

.btn.green{
  background:var(--green);
  color:#001b12;
}

.btn.yellow{
  background:var(--yellow);
  color:#241900;
}

.list{
  display:grid;
  gap:10px;
  margin-top:12px;
}

.item{
  border:1px solid var(--line);
  background:rgba(255,255,255,.035);
  border-radius:16px;
  padding:12px;
}

.itemHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.item h3{
  margin:0 0 5px;
  font-size:16px;
}

.item p{
  margin:5px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.35;
}

.tag{
  display:inline-block;
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 8px;
  color:var(--muted);
  font-size:12px;
  margin:3px 4px 0 0;
}

table{
  width:100%;
  border-collapse:collapse;
  overflow:hidden;
  border-radius:14px;
}

th,td{
  border-bottom:1px solid var(--line);
  padding:10px;
  text-align:left;
  font-size:13px;
}

th{
  color:var(--muted);
  font-weight:700;
}

.check{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:10px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.03);
}

.check input{
  width:auto;
  margin-top:4px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:760px){
  .gallery{
    grid-template-columns:repeat(4,1fr);
  }
}

.photo{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  background:#05070b;
}

.photo img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
}

.photo div{
  padding:9px;
  color:var(--muted);
  font-size:12px;
}

.hidden{
  display:none!important;
}

.mini{
  font-size:12px;
  color:var(--muted);
}

.right{
  margin-left:auto;
}

.toast{
  position:fixed;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  background:#101827;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  padding:12px 16px;
  border-radius:999px;
  color:var(--text);
  z-index:100;
  display:none;
}

.meter{
  height:12px;
  background:#07101a;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}

.meter span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--yellow),var(--red));
  width:0%;
}

.quick{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

@media(min-width:760px){
  .quick{
    grid-template-columns:repeat(4,1fr);
  }
}

.quick button{
  min-height:76px;
  text-align:left;
}

a{
  color:var(--blue);
}

@media print{
  header,nav,.noPrint,.btn{
    display:none!important;
  }

  body,.app{
    background:white;
    color:black;
  }

  .card{
    box-shadow:none;
    border:1px solid #ccc;
    background:white;
    color:black;
  }

  .mini,.sub,p,label,th{
    color:#444!important;
  }
}
</style>
</head>

<body>
<div class="app">
<header>
  <div class="top">
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>Elantra N Garage Pro</h1>
        <div class="sub">2026 build tracker • maintenance • mods • costs • notes</div>
      </div>
    </div>
    <div class="pill" id="saveStatus">Saved</div>
  </div>

  <nav id="tabs"></nav>
</header>

<main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var STORAGE_KEY = 'elantra_n_garage_pro_v1';

var DEFAULTS = {
  garage:{
    year:'2026',
    make:'Hyundai',
    model:'Elantra N',
    trim:'6MT / DCT',
    vin:'',
    plate:'',
    color:'Performance Blue',
    mileage:'0',
    purchaseDate:'',
    notes:''
  },
  settings:{
    oilInterval:3000,
    tireRotation:5000,
    transService:30000,
    brakeFluidMonths:24
  },
  service:[],
  mods:[],
  parts:[],
  notes:[],
  expenses:[],
  photos:[],
  checklist:{},
  reminders:[]
};

var CHECKLIST = [
 ['Break-in','Keep under 4,000 RPM for first 600 miles when possible'],
 ['Break-in','Vary RPM and avoid long steady highway pulls early on'],
 ['Maintenance','First oil change around 1,000 miles if you want extra protection'],
 ['Maintenance','Oil changes every 3,000-5,000 miles depending on driving'],
 ['Maintenance','Rotate tires every 5,000 miles'],
 ['Maintenance','Check tire pressure weekly'],
 ['Maintenance','Check coolant and oil level monthly'],
 ['Mods','Keep stock parts for warranty or resale'],
 ['Mods','Take photos before and after every install'],
 ['Mods','Log tune, fuel, spark plugs, and supporting mods'],
 ['Audio','Confirm CT ported box trunk fit before final mount'],
 ['Audio','Use proper fused power wire at battery'],
 ['Audio','Secure amp and sub box so they cannot slide'],
 ['Appearance','Add lighted N logo plan'],
 ['Appearance','Document wrap, tint, badge, and lighting changes']
];

var PRESET_MODS = [
 {
  name:'Oil Catch Can',
  category:'Engine',
  status:'Idea',
  cost:150,
  notes:'PCV side is usually the first choice. Keep hoses clean and serviceable.'
 },
 {
  name:'Radiator / Oil Cooler Mesh Guard',
  category:'Protection',
  status:'Idea',
  cost:80,
  notes:'Protects front heat exchangers from rocks and road debris.'
 },
 {
  name:'CT Sounds Ported Sub Box',
  category:'Audio',
  status:'Planned',
  cost:0,
  notes:'Deep bass setup. Confirm dimensions in trunk.'
 },
 {
  name:'Kicker Mono Amp',
  category:'Audio',
  status:'Planned',
  cost:0,
  notes:'Clean deep bass. Match RMS to sub impedance.'
 },
 {
  name:'Gravity GR-DBE LOC',
  category:'Audio',
  status:'Owned',
  cost:0,
  notes:'Line output converter with digital bass enhancement.'
 }
];

var tabs = [
 ['dashboard','Dashboard'],
 ['garage','Garage'],
 ['service','Service'],
 ['mods','Mods'],
 ['parts','Parts'],
 ['expenses','Expenses'],
 ['checklist','Checklist'],
 ['photos','Photos'],
 ['calculators','Calculators'],
 ['backup','Backup']
];

var state = load();
var current = 'dashboard';

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      return JSON.parse(JSON.stringify(DEFAULTS));
    }
    var parsed = JSON.parse(raw);
    return merge(DEFAULTS, parsed);
  }catch(e){
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
}

function merge(a,b){
  var out = Array.isArray(a) ? [] : {};

  Object.keys(a).forEach(function(k){
    if(b && Object.prototype.hasOwnProperty.call(b,k)){
      if(typeof a[k] === 'object' && a[k] !== null && !Array.isArray(a[k])){
        out[k] = merge(a[k], b[k]);
      }else{
        out[k] = b[k];
      }
    }else{
      out[k] = a[k];
    }
  });

  if(b){
    Object.keys(b).forEach(function(k){
      if(!Object.prototype.hasOwnProperty.call(out,k)){
        out[k]=b[k];
      }
    });
  }

  return out;
}

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  var el = document.getElementById('saveStatus');
  el.textContent = 'Saved ' + new Date().toLocaleTimeString([], {
    hour:'numeric',
    minute:'2-digit'
  });
}

function money(n){
  return '$' + Number(n||0).toLocaleString(undefined,{
    maximumFractionDigits:2
  });
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c];
  });
}

function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';
  setTimeout(function(){
    t.style.display='none';
  },1800);
}

function setTab(id){
  current=id;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function byId(id){
  return document.getElementById(id);
}

function renderTabs(){
  var nav = byId('tabs');

  nav.innerHTML = tabs.map(function(t){
    return '<button class="'+(current===t[0]?'active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';
  }).join('');

  nav.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      setTab(b.dataset.tab);
    };
  });
}

function render(){
  renderTabs();

  var main = byId('main');

  var views = {
    dashboard:dashboard,
    garage:garage,
    service:service,
    mods:mods,
    parts:parts,
    expenses:expenses,
    checklist:checklist,
    photos:photos,
    calculators:calculators,
    backup:backup
  };

  main.innerHTML = views[current]();
  bind();
}

function totals(){
  var modCost = state.mods.reduce(function(a,x){
    return a+Number(x.cost||0);
  },0);

  var partCost = state.parts.reduce(function(a,x){
    return a+Number(x.cost||0);
  },0);

  var expCost = state.expenses.reduce(function(a,x){
    return a+Number(x.amount||0);
  },0);

  return {
    modCost:modCost,
    partCost:partCost,
    expCost:expCost,
    total:modCost+partCost+expCost
  };
}

function dashboard(){
  var t = totals();
  var serviceCount = state.service.length;
  var modCount = state.mods.length;
  var done = Object.values(state.checklist).filter(Boolean).length;
  var pct = Math.round(done / CHECKLIST.length * 100);

  return `
  <section class="card hero">
    <h2>${esc(state.garage.year)} ${esc(state.garage.make)} ${esc(state.garage.model)}</h2>
    <div class="sub">${esc(state.garage.color)} • ${esc(state.garage.trim)} • ${esc(state.garage.mileage)} miles</div>

    <div class="row" style="margin-top:16px">
      <div class="stat">
        <b>${money(t.total)}</b>
        <span>Total tracked spend</span>
      </div>

      <div class="stat">
        <b>${modCount}</b>
        <span>Mods tracked</span>
      </div>

      <div class="stat">
        <b>${serviceCount}</b>
        <span>Service records</span>
      </div>

      <div class="stat">
        <b>${pct}%</b>
        <span>Checklist complete</span>
      </div>
    </div>
  </section>

  <section class="grid" style="margin-top:14px">
    <div class="card two">
      <h2>Quick Actions</h2>

      <div class="quick noPrint">
        <button class="btn secondary" data-go="service">+ Add Service</button>
        <button class="btn secondary" data-go="mods">+ Add Mod</button>
        <button class="btn secondary" data-go="expenses">+ Add Expense</button>
        <button class="btn secondary" data-go="photos">+ Add Photo</button>
      </div>

      <h3>Build Progress</h3>
      <div class="meter">
        <span style="width:${pct}%"></span>
      </div>

      <p class="mini">${done} of ${CHECKLIST.length} build checklist items complete.</p>
    </div>

    <div class="card four">
      <h2>Next Maintenance</h2>
      ${nextMaintenanceHtml()}
    </div>

    <div class="card half">
      <h2>Recent Service</h2>
      ${listMini(state.service,'service')}
    </div>

    <div class="card half">
      <h2>Recent Mods</h2>
      ${listMini(state.mods,'mods')}
    </div>
  </section>`;
}

function nextMaintenanceHtml(){
  var miles = Number(state.garage.mileage||0);
  var oil = Number(state.settings.oilInterval||3000);
  var rot = Number(state.settings.tireRotation||5000);

  var nextOil = Math.ceil((miles+1)/oil)*oil;
  var nextRot = Math.ceil((miles+1)/rot)*rot;

  return `<table>
    <tr>
      <th>Item</th>
      <th>Due at</th>
    </tr>

    <tr>
      <td>Oil Change</td>
      <td>${nextOil.toLocaleString()} mi</td>
    </tr>

    <tr>
      <td>Tire Rotation</td>
      <td>${nextRot.toLocaleString()} mi</td>
    </tr>

    <tr>
      <td>Trans Service</td>
      <td>${Number(state.settings.transService).toLocaleString()} mi</td>
    </tr>

    <tr>
      <td>Brake Fluid</td>
      <td>Every ${esc(state.settings.brakeFluidMonths)} months</td>
    </tr>
  </table>`;
}

function listMini(arr,type){
  if(!arr.length){
    return '<p class="mini">Nothing added yet.</p>';
  }

  return '<div class="list">'+arr.slice(-4).reverse().map(function(x){
    return `<div class="item">
      <h3>${esc(x.name||x.title||x.type||'Record')}</h3>
      <p>${esc(x.date||'')} ${x.mileage?'• '+esc(x.mileage)+' mi':''}</p>
      <p>${esc(x.notes||'')}</p>
    </div>`;
  }).join('')+'</div>';
}

function garage(){
 return `<section class="card">
  <h2>Garage Profile</h2>

  <div class="formgrid">
    ${field('Year','g_year',state.garage.year)}
    ${field('Make','g_make',state.garage.make)}
    ${field('Model','g_model',state.garage.model)}
    ${field('Trim','g_trim',state.garage.trim)}
    ${field('VIN','g_vin',state.garage.vin)}
    ${field('Plate','g_plate',state.garage.plate)}
    ${field('Color','g_color',state.garage.color)}
    ${field('Mileage','g_mileage',state.garage.mileage,'number')}
    ${field('Purchase Date','g_purchaseDate',state.garage.purchaseDate,'date')}

    <div class="wide">
      <label>Notes</label>
      <textarea id="g_notes" maxlength="1000">${esc(state.garage.notes)}</textarea>
    </div>
  </div>

  <div class="row noPrint" style="margin-top:12px">
    <button class="btn" id="saveGarage">Save Garage</button>
    <button class="btn secondary" onclick="window.print()">Print Build Sheet</button>
  </div>
 </section>

 <section class="card">
  <h2>Maintenance Settings</h2>

  <div class="formgrid">
    ${field('Oil Interval Miles','s_oilInterval',state.settings.oilInterval,'number')}
    ${field('Tire Rotation Miles','s_tireRotation',state.settings.tireRotation,'number')}
    ${field('Transmission Service Miles','s_transService',state.settings.transService,'number')}
    ${field('Brake Fluid Months','s_brakeFluidMonths',state.settings.brakeFluidMonths,'number')}
  </div>

  <div class="row noPrint" style="margin-top:12px">
    <button class="btn" id="saveSettings">Save Settings</button>
  </div>
 </section>`;
}

function field(label,id,value,type){
 return `<div>
  <label>${label}</label>
  <input id="${id}" type="${type||'text'}" value="${esc(value)}">
 </div>`;
}

function service(){
 return recordsPage(
  'Service Log',
  'service',
  [
    ['Date','date','date'],
    ['Mileage','mileage','number'],
    ['Service Type','type','text'],
    ['Shop / DIY','shop','text'],
    ['Cost','cost','number'],
    ['Notes','notes','textarea']
  ],
  function(x){
    return x.type||'Service';
  }
 );
}

function mods(){
 return `<section class="card noPrint">
  <h2>Preset Mods</h2>
  <p class="mini">Tap once to load useful starter items.</p>
  <button class="btn yellow" id="addPresetMods">Add Elantra N Starter Mods</button>
 </section>`+
 recordsPage(
  'Mod Tracker',
  'mods',
  [
    ['Name','name','text'],
    ['Category','category','text'],
    ['Status','status','select:Idea,Planned,Ordered,Installed,Removed'],
    ['Install Date','date','date'],
    ['Cost','cost','number'],
    ['Notes','notes','textarea']
  ],
  function(x){
    return x.name||'Mod';
  }
 );
}

function parts(){
 return recordsPage(
  'Parts List',
  'parts',
  [
    ['Part Name','name','text'],
    ['Brand','brand','text'],
    ['Part Number','partNo','text'],
    ['Status','status','select:Need,Ordered,Received,Installed'],
    ['Cost','cost','number'],
    ['Link / Store','link','text'],
    ['Notes','notes','textarea']
  ],
  function(x){
    return x.name||'Part';
  }
 );
}

function expenses(){
 return recordsPage(
  'Expense Tracker',
  'expenses',
  [
    ['Date','date','date'],
    ['Category','category','text'],
    ['Title','title','text'],
    ['Amount','amount','number'],
    ['Payment','payment','text'],
    ['Notes','notes','textarea']
  ],
  function(x){
    return x.title||x.category||'Expense';
  }
 );
}

function recordsPage(title,key,fields,titleFn){
 var total = state[key].reduce(function(a,x){
  return a+Number(x.cost||x.amount||0);
 },0);

 var form = fields.map(function(f){
   if(f[2]==='textarea'){
    return `<div class="wide">
      <label>${f[0]}</label>
      <textarea id="new_${f[1]}"></textarea>
    </div>`;
   }

   if(f[2].indexOf && f[2].indexOf('select:')===0){
     return `<div>
      <label>${f[0]}</label>
      <select id="new_${f[1]}">
        ${f[2].slice(7).split(',').map(function(o){
          return `<option>${o}</option>`;
        }).join('')}
      </select>
     </div>`;
   }

   return `<div>
    <label>${f[0]}</label>
    <input id="new_${f[1]}" type="${f[2]}" />
   </div>`;
 }).join('');

 var list = state[key].length ? state[key].slice().reverse().map(function(x){
   var tags = Object.keys(x).filter(function(k){
    return !['id','notes','link'].includes(k)&&x[k];
   }).map(function(k){
    return `<span class="tag">${esc(k)}: ${esc(x[k])}</span>`;
   }).join('');

   var link = x.link ? `<p><a href="${esc(x.link)}" target="_blank" rel="noopener">Open link</a></p>` : '';

   return `<div class="item">
    <div class="itemHead">
      <div>
        <h3>${esc(titleFn(x))}</h3>
        ${tags}
        ${link}
        <p>${esc(x.notes||'')}</p>
      </div>

      <button class="btn danger smallDel noPrint" data-key="${key}" data-id="${x.id}">Delete</button>
    </div>
   </div>`;
 }).join('') : '<p class="mini">No records yet.</p>';

 return `<section class="card">
  <div class="row">
    <h2>${title}</h2>
    <span class="pill right">Total: ${money(total)}</span>
  </div>

  <div class="formgrid noPrint">
    ${form}
  </div>

  <div class="row noPrint" style="margin-top:12px">
    <button class="btn" data-add="${key}">Add Record</button>
  </div>

  <div class="list">
    ${list}
  </div>
 </section>`;
}

function checklist(){
 var groups = {};

 CHECKLIST.forEach(function(c,i){
  if(!groups[c[0]]){
    groups[c[0]]=[];
  }
  groups[c[0]].push([i,c[1]]);
 });

 return `<section class="card">
  <h2>Build Checklist</h2>
  <p class="mini">Check items off as you finish the build.</p>

  ${Object.keys(groups).map(function(g){
    return `<h3>${esc(g)}</h3>
    <div class="list">`+groups[g].map(function(row){
      return `<label class="check">
        <input type="checkbox" data-check="${row[0]}" ${state.checklist[row[0]]?'checked':''}>
        <span>${esc(row[1])}</span>
      </label>`;
    }).join('')+`</div>`;
  }).join('')}
 </section>`;
}

function photos(){
 return `<section class="card">
  <h2>Photo Garage</h2>
  <p class="mini">Photos save inside this browser on your iPad. Use Export Backup to save everything.</p>

  <div class="formgrid noPrint">
    <div>
      <label>Photo Name</label>
      <input id="photoName" placeholder="Front grill, amp rack, dyno sheet...">
    </div>

    <div>
      <label>Choose Photo</label>
      <input id="photoFile" type="file" accept="image/*">
    </div>
  </div>

  <div class="row noPrint" style="margin-top:12px">
    <button class="btn" id="addPhoto">Add Photo</button>
  </div>

  <div class="gallery" style="margin-top:12px">
    ${state.photos.length?state.photos.slice().reverse().map(function(p){
      return `<div class="photo">
        <img src="${p.data}" alt="">
        <div>
          ${esc(p.name)}
          <br>
          <button class="btn danger smallPhotoDel noPrint" data-id="${p.id}" style="margin-top:8px;width:100%">Delete</button>
        </div>
      </div>`;
    }).join(''):'<p class="mini">No photos yet.</p>'}
  </div>
 </section>`;
}

function calculators(){
 return `<section class="grid">
  <div class="card half">
    <h2>MPG Calculator</h2>

    <div class="formgrid">
      ${field('Miles Driven','mpgMiles','','number')}
      ${field('Gallons Used','mpgGallons','','number')}
    </div>

    <button class="btn noPrint" id="calcMpg" style="margin-top:12px">Calculate MPG</button>
    <h3 id="mpgResult"></h3>
  </div>

  <div class="card half">
    <h2>Payment / Budget Calculator</h2>

    <div class="formgrid">
      ${field('Price','loanPrice','','number')}
      ${field('Down Payment','loanDown','','number')}
      ${field('APR %','loanApr','7','number')}
      ${field('Months','loanMonths','60','number')}
    </div>

    <button class="btn noPrint" id="calcLoan" style="margin-top:12px">Calculate Payment</button>
    <h3 id="loanResult"></h3>
  </div>

  <div class="card half">
    <h2>Tire Size Difference</h2>

    <div class="formgrid">
      ${field('Old Diameter Inches','oldDia','','number')}
      ${field('New Diameter Inches','newDia','','number')}
    </div>

    <button class="btn noPrint" id="calcTire" style="margin-top:12px">Calculate</button>
    <h3 id="tireResult"></h3>
  </div>

  <div class="card half">
    <h2>Horsepower Goal Notes</h2>
    <p class="mini">Use this to rough plan supporting mods. Always tune safely and protect warranty.</p>

    <textarea id="hpNotes" placeholder="Turbo, fuel pump, plugs, intercooler, tune, tires...">${esc(state.garage.hpNotes||'')}</textarea>

    <button class="btn noPrint" id="saveHpNotes" style="margin-top:12px">Save Notes</button>
  </div>
 </section>`;
}

function backup(){
 return `<section class="card">
  <h2>Backup / Restore</h2>

  <p class="mini">Export creates a JSON backup of your garage. Keep it in iCloud, Files, or GitHub.</p>

  <div class="row noPrint">
    <button class="btn green" id="exportData">Export Backup</button>
    <button class="btn secondary" id="copyData">Copy Backup Text</button>
    <button class="btn danger" id="resetData">Reset App</button>
  </div>

  <hr style="border-color:var(--line);border-style:solid none none;margin:18px 0">

  <label>Restore Backup JSON</label>
  <textarea id="restoreBox" placeholder="Paste backup JSON here"></textarea>

  <button class="btn noPrint" id="restoreData" style="margin-top:12px">Restore Backup</button>

  <h3>Current Data Preview</h3>
  <textarea readonly>${esc(JSON.stringify(state,null,2))}</textarea>
 </section>`;
}

function bind(){
 document.querySelectorAll('[data-go]').forEach(function(b){
  b.onclick=function(){
    setTab(b.dataset.go);
  };
 });

 var sg=byId('saveGarage');

 if(sg){
  sg.onclick=function(){
   ['year','make','model','trim','vin','plate','color','mileage','purchaseDate','notes'].forEach(function(k){
    state.garage[k]=byId('g_'+k).value;
   });

   save();
   toast('Garage saved');
   render();
  };
 }

 var ss=byId('saveSettings');

 if(ss){
  ss.onclick=function(){
   ['oilInterval','tireRotation','transService','brakeFluidMonths'].forEach(function(k){
    state.settings[k]=byId('s_'+k).value;
   });

   save();
   toast('Settings saved');
   render();
  };
 }

 document.querySelectorAll('[data-add]').forEach(function(b){
  b.onclick=function(){
   var key=b.dataset.add;
   var obj={id:uid()};

   document.querySelectorAll('[id^="new_"]').forEach(function(el){
    obj[el.id.replace('new_','')]=el.value;
    el.value='';
   });

   state[key].push(obj);
   save();
   toast('Added');
   render();
  };
 });

 document.querySelectorAll('.smallDel').forEach(function(b){
  b.onclick=function(){
   var key=b.dataset.key;

   state[key]=state[key].filter(function(x){
    return x.id!==b.dataset.id;
   });

   save();
   render();
  };
 });

 document.querySelectorAll('[data-check]').forEach(function(c){
  c.onchange=function(){
   state.checklist[c.dataset.check]=c.checked;
   save();
  };
 });

 var preset=byId('addPresetMods');

 if(preset){
  preset.onclick=function(){
   PRESET_MODS.forEach(function(m){
    var x=Object.assign({id:uid()},m);
    state.mods.push(x);
   });

   save();
   toast('Starter mods added');
   render();
  };
 }

 var addPhoto=byId('addPhoto');

 if(addPhoto){
  addPhoto.onclick=function(){
   var f=byId('photoFile').files[0];

   if(!f){
    toast('Choose a photo first');
    return;
   }

   var reader=new FileReader();

   reader.onload=function(e){
    state.photos.push({
      id:uid(),
      name:byId('photoName').value||f.name,
      data:e.target.result
    });

    save();
    toast('Photo added');
    render();
   };

   reader.readAsDataURL(f);
  };
 }

 document.querySelectorAll('.smallPhotoDel').forEach(function(b){
  b.onclick=function(){
   state.photos=state.photos.filter(function(p){
    return p.id!==b.dataset.id;
   });

   save();
   render();
  };
 });

 var cm=byId('calcMpg');

 if(cm){
  cm.onclick=function(){
   var m=Number(byId('mpgMiles').value);
   var g=Number(byId('mpgGallons').value);

   byId('mpgResult').textContent=(m&&g)?(m/g).toFixed(1)+' MPG':'Enter miles and gallons';
  };
 }

 var cl=byId('calcLoan');

 if(cl){
  cl.onclick=function(){
   var p=Number(byId('loanPrice').value)-Number(byId('loanDown').value);
   var apr=Number(byId('loanApr').value)/100/12;
   var mo=Number(byId('loanMonths').value);
   var pay=apr ? p*apr/(1-Math.pow(1+apr,-mo)) : p/mo;

   byId('loanResult').textContent=(p&&mo)?money(pay)+'/month':'Enter price and months';
  };
 }

 var ct=byId('calcTire');

 if(ct){
  ct.onclick=function(){
   var o=Number(byId('oldDia').value);
   var n=Number(byId('newDia').value);

   byId('tireResult').textContent=(o&&n)?(((n-o)/o)*100).toFixed(2)+'% speedometer difference':'Enter both diameters';
  };
 }

 var hp=byId('saveHpNotes');

 if(hp){
  hp.onclick=function(){
   state.garage.hpNotes=byId('hpNotes').value;
   save();
   toast('Notes saved');
  };
 }

 var ex=byId('exportData');

 if(ex){
  ex.onclick=function(){
   var blob=new Blob([JSON.stringify(state,null,2)],{
    type:'application/json'
   });

   var a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   a.download='elantra-n-garage-backup.json';
   a.click();
   URL.revokeObjectURL(a.href);
  };
 }

 var copy=byId('copyData');

 if(copy){
  copy.onclick=function(){
   navigator.clipboard.writeText(JSON.stringify(state,null,2)).then(function(){
    toast('Backup copied');
   });
  };
 }

 var reset=byId('resetData');

 if(reset){
  reset.onclick=function(){
   if(confirm('Reset all Elantra N Garage data on this device?')){
    localStorage.removeItem(STORAGE_KEY);
    state=load();
    save();
    render();
   }
  };
 }

 var restore=byId('restoreData');

 if(restore){
  restore.onclick=function(){
   try{
    var data=JSON.parse(byId('restoreBox').value);
    state=merge(DEFAULTS,data);
    save();
    toast('Backup restored');
    render();
   }catch(e){
    toast('Invalid backup JSON');
   }
  };
 }
}

render();

})();
</script>
</body>
</html>
