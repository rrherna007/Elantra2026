<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>2026 Hyundai Elantra N — Maintenance Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #0a0c0f;
  --surface: #111318;
  --surface2: #181c24;
  --border: rgba(255,255,255,0.07);
  --border-bright: rgba(255,255,255,0.14);
  --accent: #00c2ff;
  --accent2: #ff4d4d;
  --accent3: #00e5a0;
  --text: #e8eaf0;
  --muted: #6b7280;
  --warn: #f59e0b;
  --success: #10b981;
  --hyundai: #002c5f;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #001830 0%, #0a0c0f 60%);
  border-bottom: 1px solid var(--border-bright);
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.car-badge {
  background: var(--hyundai);
  border: 1px solid rgba(0,194,255,0.3);
  border-radius: 8px;
  padding: 6px 12px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.header-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: clamp(18px, 4vw, 26px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  flex: 1;
}
.header-title span { color: var(--accent); }

/* progress bar */
.progress-wrap { margin-bottom: 12px; }
.progress-label {
  display: flex;
  justify-content: space-between;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 5px;
}
.progress-bar {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* search + filter row */
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.search-wrap {
  flex: 1;
  min-width: 160px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 9px 12px 9px 34px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
}
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 14px;
  pointer-events: none;
}
.filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 9px 14px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color 0.2s;
}
.filter-btn.active { border-color: var(--accent); color: var(--accent); }
.filter-btn:hover { border-color: var(--border-bright); background: rgba(255,255,255,0.05); }
.date-input {
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  width: 130px;
}
.date-input:focus { outline: none; border-color: var(--accent); }

/* ── MAIN ── */
.main { padding: 16px; max-width: 860px; margin: 0 auto; }

/* ── SECTION CARDS ── */
.section-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.section-card.has-complete { border-color: rgba(0,229,160,0.2); }
.section-card.all-complete { border-color: var(--accent3); }

.section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.section-header:active { background: rgba(255,255,255,0.03); }

.mile-badge {
  background: linear-gradient(135deg, var(--hyundai), #003d7a);
  border: 1px solid rgba(0,194,255,0.25);
  border-radius: 6px;
  padding: 4px 10px;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: var(--accent);
  white-space: nowrap;
  min-width: 90px;
  text-align: center;
}
.section-title {
  flex: 1;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.04em;
}
.section-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-count {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.section-count.done { color: var(--accent3); }
.chevron {
  color: var(--muted);
  font-size: 12px;
  transition: transform 0.25s;
  flex-shrink: 0;
}
.section-card.open .chevron { transform: rotate(180deg); }

.mini-progress {
  width: 40px;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.mini-fill {
  height: 100%;
  background: var(--accent3);
  border-radius: 2px;
  transition: width 0.4s;
}

/* section body */
.section-body { display: none; }
.section-card.open .section-body { display: block; }

/* ── ITEMS ── */
.item-list { padding: 8px 0; }

.item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
}
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: rgba(255,255,255,0.02); }
.item-row.completed .item-text { text-decoration: line-through; color: var(--muted); }
.item-row.recommended { background: rgba(0,194,255,0.03); }
.item-row.recommended .item-text { color: #a8d8ff; }

.custom-check {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  border: 2px solid var(--border-bright);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 1px;
}
.custom-check.checked {
  background: var(--accent3);
  border-color: var(--accent3);
}
.custom-check.checked::after {
  content: '✓';
  color: #000;
  font-size: 11px;
  font-weight: 800;
}

.item-content { flex: 1; }
.item-text {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text);
}
.item-tag {
  display: inline-block;
  background: rgba(0,194,255,0.12);
  color: var(--accent);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 10px;
  font-family: 'IBM Plex Mono', monospace;
  margin-left: 6px;
  vertical-align: middle;
}
.item-tag.rec { background: rgba(245,158,11,0.12); color: var(--warn); }
.item-tag.critical { background: rgba(255,77,77,0.15); color: var(--accent2); }

.item-date {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}

.item-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 1px;
}
.action-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── NOTES AREA ── */
.section-notes {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}
.notes-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.notes-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 12px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 13px;
  resize: vertical;
  min-height: 64px;
  line-height: 1.5;
}
.notes-textarea:focus { outline: none; border-color: var(--accent); }
.notes-textarea::placeholder { color: var(--muted); }

/* ── RECEIPTS ── */
.receipts-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.receipt-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.receipt-chip {
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 20px;
  padding: 5px 12px 5px 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  cursor: pointer;
}
.receipt-chip:hover { border-color: var(--accent); }
.receipt-chip .del { color: var(--accent2); font-size: 13px; cursor: pointer; margin-left: 4px; }
.add-receipt-btn {
  background: transparent;
  border: 1px dashed var(--border-bright);
  border-radius: 20px;
  padding: 5px 12px;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.add-receipt-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal-title {
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 12px;
  color: var(--muted);
  cursor: pointer;
  font-size: 13px;
}
.modal input, .modal textarea, .modal select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border-bright);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  margin-bottom: 12px;
}
.modal input:focus, .modal textarea:focus, .modal select:focus {
  outline: none; border-color: var(--accent);
}
.modal label {
  display: block;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 5px;
}
.modal-btn {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.05em;
  cursor: pointer;
  background: linear-gradient(135deg, var(--accent), #0088cc);
  color: #000;
  margin-top: 4px;
}

/* receipt image preview */
.receipt-preview-img {
  width: 100%;
  border-radius: 8px;
  margin-top: 8px;
  display: none;
}

/* ── SUMMARY STRIP ── */
.summary-strip {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-pill {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 80px;
}
.stat-pill .num {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
}
.stat-pill .num.blue { color: var(--accent); }
.stat-pill .num.green { color: var(--accent3); }
.stat-pill .num.yellow { color: var(--warn); }

/* no results */
.no-results {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 14px;
  display: none;
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

/* hidden file input */
.hidden-file { display: none; }

/* floating action */
.fab {
  position: fixed;
  bottom: 20px;
  right: 16px;
  background: linear-gradient(135deg, var(--accent), #0088cc);
  color: #000;
  border: none;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(0,194,255,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="car-badge">ELANTRA N</div>
    <div class="header-title"><span>2026</span> Maintenance Log</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabel">Overall Progress</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search items, dates, notes…">
    </div>
    <input type="date" class="date-input" id="dateFilter" title="Filter by date">
    <button class="filter-btn" id="filterAll" onclick="setFilter('all')" >All</button>
    <button class="filter-btn" id="filterPending" onclick="setFilter('pending')">Pending</button>
    <button class="filter-btn" id="filterDone" onclick="setFilter('done')">Done</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="summary-strip">
    <div class="stat-pill"><span class="num blue" id="statSections">0</span>intervals</div>
    <div class="stat-pill"><span class="num" id="statTotal">0</span>total items</div>
    <div class="stat-pill"><span class="num green" id="statDone">0</span>completed</div>
    <div class="stat-pill"><span class="num yellow" id="statReceipts">0</span>receipts</div>
  </div>

  <div id="scheduleContainer"></div>
  <div class="no-results" id="noResults">No items match your search.</div>
</div>

<!-- FAB -->
<button class="fab" onclick="scrollToTop()" title="Back to top">↑</button>

<!-- RECEIPT MODAL -->
<div class="modal-overlay" id="receiptModal">
  <div class="modal">
    <div class="modal-title">
      Add Receipt
      <button class="modal-close" onclick="closeModal('receiptModal')">✕ Close</button>
    </div>
    <label>Shop / Description</label>
    <input type="text" id="receiptShop" placeholder="e.g. Jiffy Lube, AutoZone…">
    <label>Date</label>
    <input type="date" id="receiptDate">
    <label>Amount ($)</label>
    <input type="number" id="receiptAmount" placeholder="0.00" step="0.01">
    <label>Photo (optional)</label>
    <button class="add-receipt-btn" onclick="document.getElementById('receiptPhoto').click()">📷 Attach Photo / Document</button>
    <input type="file" id="receiptPhoto" class="hidden-file" accept="image/*,application/pdf" onchange="previewReceipt(this)">
    <img id="receiptImgPreview" class="receipt-preview-img">
    <button class="modal-btn" onclick="saveReceipt()">💾 Save Receipt</button>
  </div>
</div>

<!-- ITEM DATE MODAL -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-title">
      <span id="itemModalTitle">Log Service</span>
      <button class="modal-close" onclick="closeModal('itemModal')">✕ Close</button>
    </div>
    <label>Date Completed</label>
    <input type="date" id="itemDate">
    <label>Mileage</label>
    <input type="number" id="itemMileage" placeholder="e.g. 12500">
    <label>Cost ($)</label>
    <input type="number" id="itemCost" placeholder="0.00" step="0.01">
    <label>Notes</label>
    <textarea id="itemNotes" rows="3" placeholder="Brand used, shop name, observations…"></textarea>
    <button class="modal-btn" onclick="saveItemLog()">✅ Mark Complete</button>
  </div>
</div>

// Recommended items added to every interval
const ALWAYS_REC = [
  { text: "Add GDI Fuel System Cleaner (Liqui-Moly or CRC GDI Intake Valve Cleaner)", tag: "rec", note: "Every 5,000–10,000 miles. Use products specifically for GDI engines." },
  { text: "Check Tire Pressure (See door jamb sticker for correct PSI)", tag: "rec" },
  { text: "Use Top Tier Detergent Gasoline", tag: "rec" },
];

const OIL_BRANDS = "Recommended oils: Castrol Edge, Mobil 1, Pennzoil Platinum";

// Periodic reminders injected at correct intervals
const PERIODIC = {
  5000:  ["Replace Engine Oil and Filter — 5k interval (RECOMMENDED)"],
  30000: ["Replace Transmission Fluid (Drain & Fill — SP-IV or SP-IV-RR) — every 30k"],
  60000: ["Flush Coolant (every 5 years / 50k miles — use Green meeting MS 591-08)"],
  80000: ["Replace Serpentine Belt (60–80k mile window)"],
};

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════

let state = {};
let currentFilter = 'all';
let currentReceiptSection = null;
let currentItemKey = null;
let receiptPhotoData = null;

function loadState() {
  try { state = JSON.parse(localStorage.getItem('elantran_maint') || '{}'); }
  catch(e) { state = {}; }
}
function saveState() {
  localStorage.setItem('elantran_maint', JSON.stringify(state));
}
function getItem(key) { return state[key] || {}; }
function setItem(key, val) { state[key] = val; saveState(); }

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════

function buildItemKey(miles, idx) { return `s${miles}_i${idx}`; }
function buildSectionKey(miles) { return `sec_${miles}`; }

function render() {
  loadState();
  const container = document.getElementById('scheduleContainer');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const dateFilter = document.getElementById('dateFilter').value;
  container.innerHTML = '';

  let totalItems = 0, doneItems = 0, totalReceipts = 0;
  let visibleSections = 0;

  FACTORY.forEach(section => {
    const secKey = buildSectionKey(section.miles);
    const secState = getItem(secKey);
    const allItems = [...section.items, ...ALWAYS_REC.map(r => r.text)];
    const totalCount = allItems.length;
    let doneCount = 0;

    // count done
    allItems.forEach((_, idx) => {
      const ikey = buildItemKey(section.miles, idx);
      const istate = getItem(ikey);
      if (istate.done) doneCount++;
    });

    totalItems += totalCount;
    doneItems += doneCount;

    // receipts
    const receipts = secState.receipts || [];
    totalReceipts += receipts.length;

    // filter logic
    let matchesFilter = true;
    if (currentFilter === 'done' && doneCount === 0) matchesFilter = false;
    if (currentFilter === 'pending' && doneCount === totalCount) matchesFilter = false;

    // search: check items + notes
    let searchMatch = true;
    if (search) {
      const notes = (secState.notes || '').toLowerCase();
      const mileStr = section.miles.toString();
      const itemMatch = allItems.some(it => it.toLowerCase().includes(search));
      const receiptMatch = receipts.some(r => (r.shop||'').toLowerCase().includes(search));
      const itemDateMatch = allItems.some((_, idx) => {
        const istate = getItem(buildItemKey(section.miles, idx));
        return (istate.date||'').includes(search) || (istate.notes||'').toLowerCase().includes(search);
      });
      searchMatch = itemMatch || notes.includes(search) || mileStr.includes(search) || receiptMatch || itemDateMatch;
    }

    // date filter
    let dateMatch = true;
    if (dateFilter) {
      dateMatch = allItems.some((_, idx) => {
        const istate = getItem(buildItemKey(section.miles, idx));
        return (istate.date || '').startsWith(dateFilter);
      }) || receipts.some(r => (r.date||'').startsWith(dateFilter));
    }

    if (!matchesFilter || !searchMatch || !dateMatch) return;
    visibleSections++;

    const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
    const isOpen = secState.open || false;
    const allDone = doneCount === totalCount && totalCount > 0;
    const hasDone = doneCount > 0;

    const card = document.createElement('div');
    card.className = `section-card ${allDone ? 'all-complete' : hasDone ? 'has-complete' : ''} ${isOpen ? 'open' : ''}`;
    card.dataset.miles = section.miles;

    // build items HTML
    let itemsHTML = '';
    allItems.forEach((itemText, idx) => {
      const ikey = buildItemKey(section.miles, idx);
      const istate = getItem(ikey);
      const isRec = idx >= section.items.length;
      const done = istate.done || false;
      const matchesSearch = !search || itemText.toLowerCase().includes(search) ||
        (istate.notes||'').toLowerCase().includes(search) || (istate.date||'').includes(search);
      const display = matchesSearch ? '' : 'display:none;';

      let tagHTML = '';
      if (isRec) tagHTML = '<span class="item-tag rec">RECOMMENDED</span>';
      if (itemText.toLowerCase().includes('transmission')) tagHTML = '<span class="item-tag critical">DRAIN & FILL</span>';
      if (itemText.toLowerCase().includes('brake fluid') && itemText.toLowerCase().includes('replace')) tagHTML += '<span class="item-tag critical">DOT 3/4 ONLY</span>';
      if (itemText.toLowerCase().includes('spark plug')) tagHTML += '<span class="item-tag">NGK / DENSO</span>';
      if (itemText.toLowerCase().includes('coolant')) tagHTML += '<span class="item-tag critical">MS 591-08</span>';
      if (itemText.toLowerCase().includes('oil and filter') && itemText.toLowerCase().includes('replace')) tagHTML += `<span class="item-tag rec" title="${OIL_BRANDS}">CASTROL/MOBIL1/PENNZOIL</span>`;
      if (itemText.toLowerCase().includes('gdi')) tagHTML += '<span class="item-tag critical">GDI SPECIFIC</span>';

      const dateStr = istate.date ? `<div class="item-date">✓ ${istate.date}${istate.mileage ? ' @ '+Number(istate.mileage).toLocaleString()+' mi' : ''}${istate.cost ? ' — $'+parseFloat(istate.cost).toFixed(2) : ''}</div>` : '';
      const notesStr = istate.notes ? `<div class="item-date" style="color:#a8d8ff;">📝 ${istate.notes}</div>` : '';

      itemsHTML += `<div class="item-row ${done ? 'completed' : ''} ${isRec ? 'recommended' : ''}" style="${display}" data-key="${ikey}">
        <div class="custom-check ${done ? 'checked' : ''}" onclick="toggleItem('${ikey}', ${section.miles}, ${idx}, event)"></div>
        <div class="item-content">
          <div class="item-text">${itemText}${tagHTML}</div>
          ${dateStr}${notesStr}
        </div>
        <div class="item-actions">
          <button class="action-btn" onclick="openItemModal('${ikey}', '${itemText.replace(/'/g,"\\'")}', event)">📅 Log</button>
        </div>
      </div>`;
    });

    // receipts HTML
    let receiptsHTML = receipts.map((r, ri) => `
      <div class="receipt-chip" onclick="viewReceipt(${section.miles}, ${ri})">
        📄 ${r.shop || 'Receipt'} ${r.date ? '· '+r.date : ''} ${r.amount ? '· $'+parseFloat(r.amount).toFixed(2) : ''}
        <span class="del" onclick="deleteReceipt(event, ${section.miles}, ${ri})">✕</span>
      </div>`).join('');

    card.innerHTML = `
      <div class="section-header" onclick="toggleSection(${section.miles})">
        <div class="mile-badge">${Number(section.miles).toLocaleString()} mi</div>
        <div class="section-title">${Number(section.miles).toLocaleString()} Mile Service</div>
        <div class="section-meta">
          <div class="mini-progress"><div class="mini-fill" style="width:${pct}%"></div></div>
          <div class="section-count ${allDone ? 'done' : ''}">${doneCount}/${totalCount}</div>
          <div class="chevron">▼</div>
        </div>
      </div>
      <div class="section-body">
        <div class="item-list">${itemsHTML}</div>
        <div class="section-notes">
          <div class="notes-label">📝 Section Notes</div>
          <textarea class="notes-textarea" placeholder="Add notes for this service interval…" onchange="saveNotes(${section.miles}, this.value)">${secState.notes || ''}</textarea>
        </div>
        <div class="receipts-area">
          <div class="notes-label">🧾 Receipts & Documents</div>
          <div class="receipt-list">${receiptsHTML}</div>
          <div style="margin-top:8px;">
            <button class="add-receipt-btn" onclick="openReceiptModal(${section.miles}, event)">+ Add Receipt</button>
          </div>
        </div>
      </div>`;

    container.appendChild(card);
  });

  // no results
  document.getElementById('noResults').style.display = visibleSections === 0 ? 'block' : 'none';

  // update stats
  document.getElementById('statSections').textContent = visibleSections;
  document.getElementById('statTotal').textContent = totalItems;
  document.getElementById('statDone').textContent = doneItems;
  document.getElementById('statReceipts').textContent = totalReceipts;
  const pct = totalItems > 0 ? Math.round((doneItems / totalItems) * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

// ══════════════════════════════════════════════════════════
// INTERACTIONS
// ══════════════════════════════════════════════════════════

function toggleSection(miles) {
  const secKey = buildSectionKey(miles);
  const s = getItem(secKey);
  s.open = !s.open;
  setItem(secKey, s);
  render();
}

function toggleItem(ikey, miles, idx, e) {
  e.stopPropagation();
  const s = getItem(ikey);
  if (!s.done) {
    // mark done with today's date
    s.done = true;
    s.date = s.date || new Date().toISOString().split('T')[0];
  } else {
    s.done = false;
  }
  setItem(ikey, s);
  render();
}

function openItemModal(ikey, title, e) {
  e.stopPropagation();
  currentItemKey = ikey;
  document.getElementById('itemModalTitle').textContent = title.length > 40 ? title.slice(0,40)+'…' : title;
  const s = getItem(ikey);
  document.getElementById('itemDate').value = s.date || new Date().toISOString().split('T')[0];
  document.getElementById('itemMileage').value = s.mileage || '';
  document.getElementById('itemCost').value = s.cost || '';
  document.getElementById('itemNotes').value = s.notes || '';
  openModal('itemModal');
}

function saveItemLog() {
  if (!currentItemKey) return;
  const s = getItem(currentItemKey);
  s.done = true;
  s.date = document.getElementById('itemDate').value;
  s.mileage = document.getElementById('itemMileage').value;
  s.cost = document.getElementById('itemCost').value;
  s.notes = document.getElementById('itemNotes').value;
  setItem(currentItemKey, s);
  closeModal('itemModal');
  render();
}

function saveNotes(miles, val) {
  const secKey = buildSectionKey(miles);
  const s = getItem(secKey);
  s.notes = val;
  setItem(secKey, s);
  saveState();
}

function openReceiptModal(miles, e) {
  e && e.stopPropagation();
  currentReceiptSection = miles;
  document.getElementById('receiptShop').value = '';
  document.getElementById('receiptDate').value = new Date().toISOString().split('T')[0];
  document.getElementById('receiptAmount').value = '';
  document.getElementById('receiptImgPreview').style.display = 'none';
  document.getElementById('receiptImgPreview').src = '';
  receiptPhotoData = null;
  openModal('receiptModal');
}

function previewReceipt(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = e => {
      receiptPhotoData = e.target.result;
      const img = document.getElementById('receiptImgPreview');
      img.src = receiptPhotoData;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  } else {
    receiptPhotoData = file.name;
  }
}

function saveReceipt() {
  if (currentReceiptSection === null) return;
  const secKey = buildSectionKey(currentReceiptSection);
  const s = getItem(secKey);
  if (!s.receipts) s.receipts = [];
  s.receipts.push({
    shop: document.getElementById('receiptShop').value,
    date: document.getElementById('receiptDate').value,
    amount: document.getElementById('receiptAmount').value,
    photo: receiptPhotoData,
  });
  setItem(secKey, s);
  closeModal('receiptModal');
  render();
}

function deleteReceipt(e, miles, idx) {
  e.stopPropagation();
  const secKey = buildSectionKey(miles);
  const s = getItem(secKey);
  s.receipts = (s.receipts || []).filter((_, i) => i !== idx);
  setItem(secKey, s);
  render();
}

function viewReceipt(miles, idx) {
  const secKey = buildSectionKey(miles);
  const s = getItem(secKey);
  const r = (s.receipts || [])[idx];
  if (!r) return;
  if (r.photo && r.photo.startsWith('data:image')) {
    const w = window.open();
    w.document.write(`<img src="${r.photo}" style="max-width:100%"><p>${r.shop||''} | ${r.date||''} | $${r.amount||0}</p>`);
  } else {
    alert(`Receipt: ${r.shop||'—'}\nDate: ${r.date||'—'}\nAmount: $${r.amount||0}`);
  }
}

function setFilter(f) {
  currentFilter = f;
  ['filterAll','filterPending','filterDone'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  document.getElementById('filter' + f.charAt(0).toUpperCase() + f.slice(1)).classList.add('active');
  render();
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

// live search
document.getElementById('searchInput').addEventListener('input', () => render());
document.getElementById('dateFilter').addEventListener('change', () => render());

// close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// init
setFilter('all');
render();
</script>
